<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sail-jinx — Start sheet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="report-page">

<div class="report-toolbar report-wide no-print">
  <button onclick="window.print()" class="primary" type="button">Print</button>
  <a id="back-link" href="/races.html">← back to the race</a>
</div>

<main class="report report-wide">
  <header class="report-head">
    <h1 id="report-title">Start sheet</h1>
    <div id="report-sub" class="report-sub"></div>
  </header>

  <div id="report-state" class="banner banner-info">Loading…</div>

  <table id="report-table" class="report-table" style="display:none;">
    <thead>
      <tr id="report-head"></tr>
    </thead>
    <tbody id="report-tbody"></tbody>
  </table>

  <p class="report-note no-print" id="order-note"></p>
  <footer class="report-foot" id="report-foot"></footer>
</main>

<script src="/common.js"></script>
<script src="/scoring.js"></script>
<script>
  const raceId = new URLSearchParams(location.search).get('raceId');

  // The sheet is printed and then read aloud, and which order that wants depends on the
  // job: start order to run the sequence, sail number or name to find a boat somebody is
  // asking about. So the columns sort, and the chosen order is what prints.
  // The last four are blank on purpose: this sheet goes onto a clipboard, and what the
  // RO writes on it is what gets typed back in afterwards. They are not sortable, because
  // there is nothing in them to sort by — and a heading that reordered the fleet after
  // somebody had started writing on the paper version would be worse than useless.
  //
  // Came is first of the four for the same reason it is first on the race page: it is
  // ticked before the gun, and the two time boxes beside it stay empty for a boat that
  // never came out.
  const COLUMNS = [
    { key: 'sail',   label: 'Sail #', cls: 'mono' },
    { key: 'name',   label: 'Boat',   cls: 'nowrap' },
    { key: 'offset', label: 'Offset', cls: 'num-cell mono' },
    { key: 'start',  label: 'Start',  cls: 'num-cell mono' },
    { key: 'came',   label: 'Came',   cls: 'write-in write-in-tick', write: 'tick' },
    { key: 'wStart', label: 'Actual<br>Start',  cls: 'write-in write-in-time', write: true },
    { key: 'wFinish', label: 'Actual<br>Finish', cls: 'write-in write-in-time', write: true },
    { key: 'notes',  label: 'Notes',  cls: 'write-in write-in-notes', write: true }
  ];

  let rows = [];
  // Start order by default, earliest first. It was by name, on the reasoning that the
  // sheet is mostly used to look a boat up — but on a clipboard the question is always
  // "who is next", and the answer to that should be the next line rather than something
  // to scan for. Sorting by name is still one click away.
  const DEFAULT_SORT = 'start';
  let sortKey = DEFAULT_SORT;
  let sortDir = 1;

  function sorted() {
    const col = sortKey;
    return rows.slice().sort((a, b) => {
      const x = a[col], y = b[col];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      const cmp = (typeof x === 'number' && typeof y === 'number')
        ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });
      return cmp * sortDir;
    });
  }

  function render() {
    document.getElementById('report-head').innerHTML = COLUMNS.map(c => {
      if (c.write) return '<th class="' + c.cls + '">' + c.label + '</th>';
      const arrow = sortKey === c.key ? (sortDir > 0 ? ' ▲' : ' ▼') : '';
      return '<th class="sortable ' + c.cls + '" data-key="' + c.key + '">'
        + c.label + arrow + '</th>';
    }).join('');

    document.getElementById('report-tbody').innerHTML = sorted().map(r =>
      '<tr>' + COLUMNS.map(c => {
        // A drawn box rather than the ☐ character: the glyph is missing from enough
        // print fonts to come out as a tofu square on somebody's club printer.
        if (c.write === 'tick')
          return '<td class="' + c.cls + '"><span class="tickbox"></span></td>';
        if (c.write) return '<td class="' + c.cls + '"></td>';
        const v = c.key === 'offset'
          ? (r.offset == null ? '' : '+' + r.offset) : r[c.key];
        return '<td class="' + c.cls + '">' + esc(v) + '</td>';
      }).join('') + '</tr>').join('');

    document.querySelectorAll('#report-head .sortable').forEach(th => {
      th.onclick = () => {
        const key = th.dataset.key;
        // Clicking the active column reverses it; a third click returns to start order,
        // which is the one the RO needs on the water.
        // Clicking the active column reverses it; a third click returns to start order,
        // which is what the sheet is for.
        if (sortKey !== key) { sortKey = key; sortDir = 1; }
        else if (sortDir === 1) { sortDir = -1; }
        else { sortKey = DEFAULT_SORT; sortDir = 1; }
        render();
        updateOrderNote();
      };
    });
    updateOrderNote();
  }

  function updateOrderNote() {
    const note = document.getElementById('order-note');
    if (sortKey === DEFAULT_SORT && sortDir > 0) {
      note.textContent = 'in start order — click a heading to sort';
      return;
    }
    const col = COLUMNS.find(c => c.key === sortKey);
    note.textContent = 'sorted by ' + col.label.replace('<br>', ' ').toLowerCase()
      + (sortDir > 0 ? '' : ', reversed') + ' — click the header again to return to start order';
  }

  (async () => {
    const state = document.getElementById('report-state');
    if (!raceId) {
      state.className = 'banner banner-err';
      state.textContent = 'No race given.';
      return;
    }
    document.getElementById('back-link').href = '/race.html?raceId=' + encodeURIComponent(raceId);

    const [bundleR, cfg] = await Promise.all([
      fetchJson('/api/races/' + encodeURIComponent(raceId)),
      getConfig()
    ]);
    if (!bundleR.ok) {
      state.className = 'banner banner-err';
      state.textContent = 'Could not load race: ' + errorOf(bundleR);
      return;
    }
    const b = bundleR.body;
    const sheet = b.startSheet;

    document.getElementById('report-title').textContent =
      (b.seriesName ? b.seriesName + ' — ' : '') + 'Race ' + b.race.number + ' — start times';
    document.getElementById('report-sub').textContent = [
      b.race.date ? fmtDate(b.race.date) : null,
      sheet ? 'earliest start ' + String(sheet.earliestStart).slice(0, 5) : null,
      sheet ? 'target ' + sheet.targetElapsedMinutes + ' min' : null,
    ].filter(Boolean).join('   ·   ');

    if (!sheet || !(sheet.starts || []).length) {
      state.className = 'banner banner-warn';
      state.innerHTML = 'No start times have been computed for this race yet. '
        + '<a href="/race.html?raceId=' + encodeURIComponent(raceId) + '">Compute them first.</a>';
      return;
    }

    // Identity comes from the entrant list; the start sheet only carries ids.
    const byId = new Map(((b.entrants && b.entrants.entrants) || [])
      .map(e => [String(e.boatId), e]));

    const earliest = parseTime(sheet.earliestStart);
    rows = sheet.starts.map(s => {
      const e = byId.get(String(s.boatId));
      const start = parseTime(s.startTime);
      const offset = (earliest == null || start == null) ? null
        : Math.round((start - earliest) / 60);
      return {
        sail: e ? e.sailNumber : s.boatId,
        name: e ? e.name : '',
        offset,
        start: fmtTimeOfDay(start).slice(0, 5)
      };
    });

    state.style.display = 'none';
    document.getElementById('report-table').style.display = '';
    render();
    document.getElementById('report-foot').textContent =
      rows.length + ' boats   ·   ' + (cfg ? cfg.club.longName : '')
      + '   ·   generated ' + new Date().toLocaleString();
  })();
</script>
</body>
</html>
