<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sail-jinx — Race</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<main>
  <div class="race-head">
    <h1 id="race-title">Race</h1>
    <div class="race-nav">
      <button id="prev-btn" type="button" disabled>← Previous</button>
      <button id="next-btn" type="button" disabled>Next →</button>
    </div>
  </div>

  <div id="ctrl-msg" class="banner banner-info">Loading…</div>

  <section id="race-setup" style="display:none;">
    <h2>Setup</h2>
    <div class="form-grid">
      <label for="f-earliest">Earliest start</label>
      <input id="f-earliest" placeholder="18:00">

      <label for="f-target">Target elapsed (min)</label>
      <input id="f-target" type="number" min="1">

      <label for="f-course">Course length (nm)</label>
      <span>
        <input id="f-course" type="number" step="0.1" min="0">
        <button id="calc-course-btn" type="button">Calculate</button>
        <span id="course-note" class="hint"></span>
      </span>
    </div>
    <div class="toolbar">
      <button id="save-setup-btn" type="button">Save setup</button>
      <button id="start-times-btn" class="primary" type="button">Compute start times</button>
      <a id="report-starts-link" class="button-link" href="#" target="_blank">Start sheet ▸</a>
      <span id="setup-msg" class="hint"></span>
    </div>
  </section>

  <section id="race-entrants" style="display:none;">
    <div class="section-head">
      <h2>Entrants <span id="entrants-count" class="hint"></span></h2>
      <div class="filters">
        <label><input type="checkbox" id="hide-dnc"> Hide non-starters</label>
        <label><input type="checkbox" id="hide-finished"> Hide finished</label>
        <label>Duty boat
          <select id="duty-boat"><option value="">— none —</option></select>
        </label>
      </div>
    </div>

    <table id="entrants-table">
      <thead><tr id="entrants-head"></tr></thead>
      <tbody id="entrants-tbody"></tbody>
    </table>

    <div class="toolbar" id="add-entrant-bar">
      <label for="add-boat">Add a boat</label>
      <input id="add-boat" list="boat-matches" placeholder="sail number or name"
             autocomplete="off">
      <datalist id="boat-matches"></datalist>
      <button id="add-existing-btn" type="button">Add from register</button>
      <button id="add-new-btn" type="button">Add &amp; register</button>
      <button id="add-oneoff-btn" type="button">One-off only</button>
      <span id="add-msg" class="hint"></span>
    </div>
  </section>

  <div id="save-bar" class="save-bar" style="display:none;">
    <button id="save-btn" class="primary" type="button">Save</button>
    <button id="reset-btn" type="button">Reset</button>
    <span id="save-summary"></span>
  </div>

  <section id="handicap-panel" style="display:none;">
    <div class="section-head">
      <h2>Handicaps</h2>
      <a id="report-finish-link" class="button-link" href="#" target="_blank">Finish sheet ▸</a>
    </div>
    <div class="toolbar">
      <button id="process-btn" class="primary" type="button">Process handicaps</button>
      <button id="save-handicaps-btn" type="button" disabled>Save &amp; carry forward</button>
      <button id="unlock-btn" type="button" style="display:none;">Unlock race</button>
      <span id="handicap-msg" class="hint"></span>
    </div>
    <div id="handicap-summary"></div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/scoring.js"></script>
<script>
  // ---------------------------------------------------------------------------
  // State. `bundle` is the server's answer to GET /api/races/{id}; everything
  // the user has typed but not saved lives in the dirty* maps beside it, so a
  // reload from the server never silently discards an edit in progress.
  // ---------------------------------------------------------------------------
  let raceId = null;
  let bundle = null;
  let entrants = [];
  let timesMap = {};                 // boatId -> {came, actualStart, finish}
  let dutyBoatId = null;
  let boatOrder = [];                // working order on the night
  let dirtyTcf = new Map();          // boatId -> Number
  let dirtyFlags = new Map();        // boatId -> {added:[], removed:[]}
  let adjustments = new Map();       // boatId -> Adjustment (from Process)
  let adjustmentsSaved = false;
  let locked = false;
  let register = [];                 // the fleet register, for the add-boat box
  let scorer = null;
  let placeMap = new Map();
  let baseline = '';                 // serialised saved state, for dirty detection
  let lastFinish = null;             // for the finish-time prefill

  const params = new URLSearchParams(location.search);

  // --- derived helpers -------------------------------------------------------

  function rebuildScorer() {
    scorer = createScorer({
      entrants,
      startSheet: bundle && bundle.startSheet,
      times: timesMap,
      dutyBoatId,
      flagOverrides: dirtyFlags,
      tcfOverrides: dirtyTcf
    });
    placeMap = scorer.places('pursuit');
  }

  function timesFor(boatId) {
    const k = String(boatId);
    if (!timesMap[k]) timesMap[k] = { came: false, actualStart: null, finish: null };
    return timesMap[k];
  }

  function tcfOf(e) {
    return dirtyTcf.has(e.boatId) ? dirtyTcf.get(e.boatId) : e.tcf;
  }

  function stateJson() {
    return JSON.stringify({
      times: timesMap,
      dutyBoatId,
      boatOrder,
      tcf: [...dirtyTcf.entries()].sort(),
      flags: [...dirtyFlags.entries()].sort()
    });
  }

  function isDirty() { return stateJson() !== baseline; }

  // --- unsaved-edit rescue ---------------------------------------------------
  // Race night happens on a laptop that may get closed, bumped, or refreshed.
  // Anything typed is mirrored into sessionStorage on every change and restored
  // on load, so a stray reload never costs the finish times.

  function sessionKey() { return 'sail-jinx.race.' + raceId; }

  function sessionSave() {
    try { sessionStorage.setItem(sessionKey(), stateJson()); } catch (_) {}
  }

  function sessionRestore() {
    try {
      const raw = sessionStorage.getItem(sessionKey());
      if (!raw || raw === baseline) return false;
      const p = JSON.parse(raw);
      timesMap = p.times || timesMap;
      dutyBoatId = p.dutyBoatId ?? dutyBoatId;
      boatOrder = p.boatOrder || boatOrder;
      dirtyTcf = new Map(p.tcf || []);
      dirtyFlags = new Map(p.flags || []);
      return true;
    } catch (_) { return false; }
  }

  function sessionClear() {
    try { sessionStorage.removeItem(sessionKey()); } catch (_) {}
  }

  function touched() {
    rebuildScorer();
    sessionSave();
    renderEntrants();
    updateSaveBar();
  }

  // --- columns ---------------------------------------------------------------

  const COLS = [
    { key: 'drag', label: '', sortable: false, cls: 'drag-handle',
      render: () => '<span title="Drag to reorder">☰</span>' },
    { key: 'sail', label: 'Sail #', get: e => e.sailNumber || '' },
    { key: 'name', label: 'Name',
      get: e => e.name || '',
      render: e => esc(e.name || '')
        + (e.entryType === 'ONE_OFF' ? ' <span class="tag" title="Not in the register">one-off</span>' : '')
        + (e.entryType === 'CASUAL' ? ' <span class="tag">casual</span>' : '') },
    { key: 'tcf', label: 'TCF', cls: 'num-cell',
      get: e => tcfOf(e),
      render: e => {
        if (locked || !isAdmin()) return esc(fmtTcf(tcfOf(e)));
        const dirty = dirtyTcf.has(e.boatId);
        return '<input type="number" step="0.0001" class="tcf-input' + (dirty ? ' dirty' : '')
          + '" data-id="' + esc(e.boatId) + '" value="' + esc(fmtTcf(tcfOf(e))) + '">';
      } },
    { key: 'allocated', label: 'Allocated<br>Start', cls: 'num-cell',
      get: e => scorer.allocatedStartSeconds(e) ?? NaN,
      render: e => esc(fmtTimeOfDay(scorer.allocatedStartSeconds(e))) },
    { key: 'came', label: 'Came', sortable: false,
      get: e => timesFor(e.boatId).came ? 1 : 0,
      render: e => {
        const t = timesFor(e.boatId);
        if (locked) return t.came ? '✓' : '';
        const duty = String(dutyBoatId) === String(e.boatId);
        return '<input type="checkbox" class="came-input" data-id="' + esc(e.boatId) + '"'
          + ((t.came && !duty) ? ' checked' : '') + (duty ? ' disabled' : '') + '>';
      } },
    { key: 'actualStart', label: 'Actual<br>Start',
      get: e => timesFor(e.boatId).actualStart || '',
      render: e => timeInput(e, 'actualStart') },
    { key: 'actualStartNow', label: '', sortable: false, cls: 'now-col', nowField: 'actualStart',
      render: e => nowButton(e, 'actualStart') },
    { key: 'finish', label: 'Actual<br>Finish',
      get: e => timesFor(e.boatId).finish || '',
      render: e => timeInput(e, 'finish') },
    { key: 'finishNow', label: '', sortable: false, cls: 'now-col', nowField: 'finish',
      render: e => nowButton(e, 'finish') },
    { key: 'late', label: 'Late', cls: 'num-cell',
      get: e => scorer.lateSeconds(e) ?? NaN,
      render: e => {
        const s = scorer.lateSeconds(e);
        if (s == null || !timesFor(e.boatId).actualStart) return '';
        const sign = s < 0 ? '-' : '';
        const a = Math.abs(s);
        return esc(sign + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'));
      } },
    { key: 'scoredFinish', label: 'Scored<br>Finish', cls: 'num-cell',
      get: e => scorer.scoredFinishSeconds(e) ?? NaN,
      render: e => esc(fmtTimeOfDay(scorer.scoredFinishSeconds(e))) },
    { key: 'corrected', label: 'Corrected<br>Finish', cls: 'num-cell',
      get: e => scorer.correctedFinishSeconds(e) ?? NaN,
      render: e => esc(fmtTimeOfDay(scorer.correctedFinishSeconds(e))) },
    { key: 'elapsed', label: 'Scored<br>Elapsed', cls: 'num-cell',
      get: e => scorer.scoredElapsedSeconds(e) ?? NaN,
      render: e => esc(fmtElapsed(scorer.scoredElapsedSeconds(e))) },
    { key: 'flags', label: 'Flags', sortable: false, cls: 'flag-cell',
      get: e => scorer.flags(e).join(', '),
      render: e => esc(scorer.flags(e).join(', ')) || '<span class="hint">—</span>' },
    { key: 'place', label: 'Place', cls: 'num-cell',
      get: e => placeMap.get(String(e.boatId)) ?? NaN,
      render: e => esc(placeMap.get(String(e.boatId)) ?? '') },
    { key: 'adjustment', label: 'Adjustment', cls: 'num-cell adjustment-cell',
      get: e => {
        const a = adjustments.get(String(e.boatId));
        return a ? a.netAdjustmentMinutes : NaN;
      },
      render: e => {
        const a = adjustments.get(String(e.boatId));
        if (!a) return '';
        const tip = [
          'Penalty:        ' + fmtSignedMinSec(a.penaltyMinutes),
          'Redistribution: ' + fmtSignedMinSec(-a.rewardMinutes),
          'New TCF:        ' + fmtTcf(a.newTcf)
        ].join('\n');
        return '<span class="adjustment" title="' + esc(tip) + '">'
          + esc(fmtSignedMinSec(a.netAdjustmentMinutes)) + '</span>';
      } }
  ];

  function activeCols() {
    return COLS.filter(c => {
      if (locked && (c.key === 'drag' || c.nowField)) return false;
      if (c.key === 'adjustment' && adjustments.size === 0) return false;
      return true;
    });
  }

  function timeInput(e, field) {
    const t = timesFor(e.boatId);
    if (locked) return esc(t[field] || '');
    return '<input type="text" class="time-input" placeholder="HH:MM:SS" data-id="'
      + esc(e.boatId) + '" data-field="' + field + '" value="' + esc(t[field] || '') + '"'
      + (t.came ? '' : ' disabled') + '>';
  }

  function nowButton(e, field) {
    const t = timesFor(e.boatId);
    if (locked || !t.came) return '';
    return '<button type="button" class="now-btn" data-id="' + esc(e.boatId)
      + '" data-field="' + field + '">NOW</button>';
  }

  // --- sorting ---------------------------------------------------------------

  let sortStack = [];   // [{key, dir}] — most significant first

  function orderedEntrants() {
    let rows = entrants.slice();
    if (sortStack.length) {
      const cols = sortStack
        .map(s => ({ col: COLS.find(c => c.key === s.key), dir: s.dir }))
        .filter(s => s.col && s.col.get);
      rows.sort((a, b) => {
        for (const { col, dir } of cols) {
          const cmp = compareValues(col.get(a), col.get(b));
          if (cmp !== 0) return cmp * dir;
        }
        return 0;
      });
    } else if (boatOrder.length) {
      const pos = new Map(boatOrder.map((id, i) => [String(id), i]));
      rows.sort((a, b) => (pos.get(String(a.boatId)) ?? 1e9) - (pos.get(String(b.boatId)) ?? 1e9));
    }
    return rows.filter(keepRow);
  }

  // Empty values and NaN always sort last, whichever direction is asked for —
  // a boat with no finish time is not "first", it is simply not yet ranked.
  function compareValues(a, b) {
    const aEmpty = a == null || a === '' || (typeof a === 'number' && isNaN(a));
    const bEmpty = b == null || b === '' || (typeof b === 'number' && isNaN(b));
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;
    if (bEmpty) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return String(a).localeCompare(String(b));
  }

  function keepRow(e) {
    const t = timesFor(e.boatId);
    if (document.getElementById('hide-dnc').checked && !t.came) return false;
    if (document.getElementById('hide-finished').checked && t.finish) return false;
    return true;
  }

  // --- rendering -------------------------------------------------------------

  function renderHead() {
    const cols = activeCols();
    document.getElementById('entrants-head').innerHTML = cols.map(c => {
      if (c.nowField) {
        return '<th class="now-col"><button type="button" class="now-btn now-head-btn" '
          + 'data-field="' + c.nowField + '" title="Stamp every empty cell in this column">'
          + 'NOW</button></th>';
      }
      if (c.sortable === false) return '<th>' + c.label + '</th>';
      const s = sortStack.find(x => x.key === c.key);
      const arrow = s ? (s.dir > 0 ? ' ▲' : ' ▼') : '';
      return '<th class="sortable" data-key="' + esc(c.key) + '">' + c.label + arrow + '</th>';
    }).join('');

    document.querySelectorAll('#entrants-head .sortable').forEach(th => {
      th.onclick = (ev) => {
        const key = th.dataset.key;
        const existing = sortStack.find(x => x.key === key);
        if (!ev.shiftKey) sortStack = existing ? [existing] : [];
        if (existing) existing.dir = -existing.dir;
        else sortStack.push({ key, dir: 1 });
        renderHead();
        renderEntrants();
      };
    });
    document.querySelectorAll('#entrants-head .now-head-btn').forEach(btn => {
      btn.onclick = () => stampColumn(btn.dataset.field);
    });
  }

  function renderEntrants() {
    const cols = activeCols();
    const rows = orderedEntrants();
    document.getElementById('entrants-tbody').innerHTML = rows.map(e => {
      const cells = cols.map(c => {
        const html = c.render ? c.render(e) : esc(c.get ? c.get(e) : '');
        return '<td class="' + (c.cls || '') + '">' + html + '</td>';
      }).join('');
      return '<tr data-id="' + esc(e.boatId || '') + '"'
        + (locked ? '' : ' draggable="true"') + '>' + cells + '</tr>';
    }).join('');
    document.getElementById('entrants-count').textContent =
      '(' + rows.length + (rows.length === entrants.length ? '' : ' of ' + entrants.length) + ')';
    wireRows();
  }

  function wireRows() {
    document.querySelectorAll('.came-input').forEach(cb => {
      cb.onchange = () => {
        const t = timesFor(cb.dataset.id);
        t.came = cb.checked;
        // Clearing "came" clears the times with it: a boat that never came
        // cannot have a start or a finish, and leaving stale values behind
        // would quietly feed the handicap engine.
        if (!t.came) { t.actualStart = null; t.finish = null; }
        touched();
      };
    });
    document.querySelectorAll('.time-input').forEach(input => {
      const commit = () => {
        const t = timesFor(input.dataset.id);
        const raw = input.value.trim();
        if (!raw) { t[input.dataset.field] = null; touched(); return; }
        const norm = reformatTime(raw);
        // Unparseable input is left on screen for the user to fix rather than
        // silently dropped.
        if (norm == null) { input.classList.add('invalid'); return; }
        input.classList.remove('invalid');
        t[input.dataset.field] = norm;
        if (input.dataset.field === 'finish') lastFinish = norm;
        touched();
      };
      input.onblur = commit;
      input.onkeydown = (ev) => { if (ev.key === 'Enter') { commit(); input.blur(); } };
      input.onfocus = () => {
        // Prefill the minute so the RO only keys the seconds.
        if (input.value) return;
        const e = entrants.find(x => String(x.boatId) === input.dataset.id);
        input.value = input.dataset.field === 'finish' ? finishPrefix(e) : startPrefix(e);
        input.setSelectionRange(input.value.length, input.value.length);
      };
    });
    document.querySelectorAll('.tcf-input').forEach(input => {
      input.onchange = () => {
        const v = Number(input.value);
        if (!isFinite(v) || v <= 0) return;
        dirtyTcf.set(input.dataset.id, v);
        touched();
      };
    });
    document.querySelectorAll('.now-btn:not(.now-head-btn)').forEach(btn => {
      btn.onclick = () => {
        const t = timesFor(btn.dataset.id);
        t[btn.dataset.field] = localNow();
        if (btn.dataset.field === 'finish') lastFinish = t.finish;
        touched();
      };
    });
    document.querySelectorAll('.flag-cell').forEach(td => {
      td.onclick = () => {
        if (locked) return;
        const id = td.closest('tr').dataset.id;
        openFlagPopover(td, id);
      };
    });
    wireDrag();
  }

  function startPrefix(e) {
    const a = scorer.allocatedStartSeconds(e);
    return a == null ? '' : fmtTimeOfDay(a).slice(0, 6);
  }

  // Boats in a pursuit race finish bunched together, so the next finish is
  // most likely in the same minute as the last one.
  function finishPrefix(e) {
    if (lastFinish) return lastFinish.slice(0, 6);
    const a = scorer.allocatedStartSeconds(e);
    const target = (bundle.race.targetElapsedMinutes || 60) * 60;
    return a == null ? '' : fmtTimeOfDay(a + target).slice(0, 6);
  }

  function stampColumn(field) {
    const now = localNow();
    let n = 0;
    for (const e of orderedEntrants()) {
      const t = timesFor(e.boatId);
      if (!t.came || t[field]) continue;
      t[field] = now;
      n++;
    }
    if (field === 'finish' && n) lastFinish = now;
    touched();
    setMsg('add-msg', n ? ('Stamped ' + n + ' boats at ' + now + '.') : 'Nothing left to stamp.');
  }

  // --- drag to reorder -------------------------------------------------------

  let dragId = null;

  function wireDrag() {
    document.querySelectorAll('#entrants-tbody tr[draggable]').forEach(tr => {
      tr.ondragstart = (ev) => {
        dragId = tr.dataset.id;
        ev.dataTransfer.effectAllowed = 'move';
      };
      tr.ondragover = (ev) => { ev.preventDefault(); tr.classList.add('drag-over'); };
      tr.ondragleave = () => tr.classList.remove('drag-over');
      tr.ondrop = (ev) => {
        ev.preventDefault();
        tr.classList.remove('drag-over');
        if (!dragId || dragId === tr.dataset.id) return;
        // Dragging establishes an explicit working order, which only means
        // anything if we stop sorting by a column.
        sortStack = [];
        const ids = orderedEntrants().map(e => String(e.boatId));
        const from = ids.indexOf(dragId);
        const to = ids.indexOf(tr.dataset.id);
        if (from < 0 || to < 0) return;
        ids.splice(to, 0, ids.splice(from, 1)[0]);
        boatOrder = ids;
        dragId = null;
        renderHead();
        touched();
      };
    });
  }

  // --- flags popover ---------------------------------------------------------

  function openFlagPopover(anchor, boatId) {
    document.querySelectorAll('.flag-popover').forEach(p => p.remove());
    const e = entrants.find(x => String(x.boatId) === String(boatId));
    if (!e) return;
    const effective = scorer.flags(e);
    const ov = dirtyFlags.get(String(boatId)) || { added: [], removed: [] };

    const pop = document.createElement('div');
    pop.className = 'flag-popover';
    pop.innerHTML = KNOWN_FLAGS.map(f => {
      const on = effective.includes(f);
      const manual = ov.added.includes(f) || ov.removed.includes(f);
      return '<label' + (manual ? ' class="manual"' : '') + '>'
        + '<input type="checkbox" value="' + f + '"' + (on ? ' checked' : '') + '> ' + f
        + '</label>';
    }).join('') + '<div class="popover-foot hint">Derived flags can be cleared by '
      + 'fixing the times.</div>';

    anchor.appendChild(pop);
    pop.querySelectorAll('input').forEach(cb => {
      cb.onclick = (ev) => ev.stopPropagation();
      cb.onchange = () => {
        const f = cb.value;
        const cur = dirtyFlags.get(String(boatId)) || { added: [], removed: [] };
        const added = new Set(cur.added);
        const removed = new Set(cur.removed);
        if (cb.checked) { added.add(f); removed.delete(f); }
        else { removed.add(f); added.delete(f); }
        dirtyFlags.set(String(boatId), { added: [...added], removed: [...removed] });
        pop.remove();
        touched();
      };
    });

    const close = (ev) => {
      if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', close); }
    };
    setTimeout(() => document.addEventListener('click', close), 0);
  }

  // --- adding boats on the night ---------------------------------------------

  // Matching uses the same rules as the register itself (scoring.js, which mirrors
  // identity/IdGenerator.java) rather than an approximation of them — otherwise the RO
  // can pick a boat here and have the server resolve a different one.
  function findRegisterMatches(text) {
    const typed = String(text || '').trim();
    if (!typed) return [];
    const asSail = stripSailPrefix(typed);
    const asName = normName(typed);

    // An exact sail-number hit is the answer, whatever else also contains those digits.
    const exact = register.filter(b => asSail && sameSailNumber(b.sailNumber, typed));
    if (exact.length) return exact;

    return register.filter(b =>
      (asSail && stripSailPrefix(b.sailNumber).includes(asSail))
      || (asName && normName(b.name).includes(asName)));
  }

  function refreshBoatMatches() {
    const text = document.getElementById('add-boat').value;
    const already = new Set(entrants.map(e => String(e.boatId)));
    const matches = findRegisterMatches(text).filter(b => !already.has(b.id));
    document.getElementById('boat-matches').innerHTML = matches
      .map(b => '<option value="' + esc(b.sailNumber + ' — ' + b.name) + '">')
      .join('');
  }

  function addEntrant(entrant) {
    entrants.push(entrant);
    if (boatOrder.length) boatOrder.push(String(entrant.boatId));
    document.getElementById('add-boat').value = '';
    touched();
    renderDutyOptions();
  }

  async function onAddExisting() {
    const text = document.getElementById('add-boat').value;
    const already = new Set(entrants.map(e => String(e.boatId)));
    const matches = findRegisterMatches(text).filter(b => !already.has(b.id));
    if (!matches.length) {
      setMsg('add-msg', 'No boat in the register matches "' + text + '".');
      return;
    }
    if (matches.length > 1) {
      setMsg('add-msg', matches.length + ' boats match — be more specific: '
        + matches.slice(0, 4).map(b => b.sailNumber).join(', '));
      return;
    }
    const b = matches[0];
    addEntrant({ boatId: b.id, sailNumber: b.sailNumber, name: b.name,
      division: b.division, spinnaker: b.spinnaker, tcf: b.currentTcf,
      entryType: b.casual ? 'CASUAL' : 'ROSTER' });
    setMsg('add-msg', 'Added ' + b.sailNumber + '. Save to keep it.');
  }

  async function onAddNew() {
    const text = document.getElementById('add-boat').value.trim();
    if (!text) { setMsg('add-msg', 'Type a sail number or name first.'); return; }
    const { sail, name } = splitSailAndName(text);
    const tcf = Number(prompt('Starting TCF for ' + (name || sail), '1.0000'));
    if (!isFinite(tcf) || tcf <= 0) { setMsg('add-msg', 'Cancelled — no TCF given.'); return; }

    const r = await postJson('/api/boats',
      { sailNumber: sail, name: name || sail, currentTcf: tcf, casual: true });
    if (!r.ok) { setMsg('add-msg', 'Could not register: ' + errorOf(r)); return; }
    const b = r.body.boat;
    register.push(b);
    addEntrant({ boatId: b.id, sailNumber: b.sailNumber, name: b.name,
      division: b.division, spinnaker: b.spinnaker, tcf: b.currentTcf, entryType: 'CASUAL' });
    setMsg('add-msg', 'Registered and added ' + b.sailNumber + '.');
  }

  function onAddOneOff() {
    const text = document.getElementById('add-boat').value.trim();
    if (!text) { setMsg('add-msg', 'Type a sail number or name first.'); return; }
    const { sail, name } = splitSailAndName(text);
    const tcf = Number(prompt('TCF for this race only', '1.0000'));
    if (!isFinite(tcf) || tcf <= 0) { setMsg('add-msg', 'Cancelled — no TCF given.'); return; }
    addEntrant({ boatId: null, sailNumber: sail, name: name || sail,
      division: null, spinnaker: null, tcf, entryType: 'ONE_OFF' });
    setMsg('add-msg', 'Added as a one-off — it carries no handicap forward.');
  }

  // "AUS123 — Wet Dream" (from the datalist) or free text. A leading token with
  // a digit in it is taken as the sail number.
  function splitSailAndName(text) {
    const dash = text.split(/\s+[—-]\s+/);
    if (dash.length > 1) return { sail: dash[0].trim(), name: dash.slice(1).join(' - ').trim() };
    const parts = text.trim().split(/\s+/);
    if (parts.length > 1 && /\d/.test(parts[0]))
      return { sail: parts[0], name: parts.slice(1).join(' ') };
    return /\d/.test(text) ? { sail: text.trim(), name: '' } : { sail: '', name: text.trim() };
  }

  // --- save ------------------------------------------------------------------

  function updateSaveBar() {
    document.getElementById('save-bar').style.display = (isDirty() && !locked) ? '' : 'none';
    const n = entrants.filter(e => timesFor(e.boatId).finish).length;
    document.getElementById('save-summary').textContent =
      n + ' finish time' + (n === 1 ? '' : 's') + ' recorded';
  }

  async function doSave() {
    // Entrants first: a TCF edit changes what the times are scored against, and
    // saving times against the old handicaps would be briefly wrong.
    if (dirtyTcf.size || entrantsChanged()) {
      const payload = {
        tcfSource: dirtyTcf.size ? 'MANUAL_EDIT' : undefined,
        entrants: entrants.map(e => ({
          boatId: e.boatId, sailNumber: e.sailNumber, name: e.name,
          division: e.division, spinnaker: e.spinnaker,
          tcf: tcfOf(e), entryType: e.entryType
        }))
      };
      const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/entrants', payload);
      if (!r.ok) { setMsg('save-summary', 'Could not save entrants: ' + errorOf(r)); return; }
    }

    const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/times', {
      boatOrder, dutyBoatId: dutyBoatId || null, times: timesMap
    });
    if (!r.ok) { setMsg('save-summary', 'Could not save times: ' + errorOf(r)); return; }

    sessionClear();
    await load();
    setCtrlMsg('banner-ok', 'Saved.');
  }

  function entrantsChanged() {
    const saved = (bundle.entrants && bundle.entrants.entrants) || [];
    return saved.length !== entrants.length;
  }

  // --- setup + start times ---------------------------------------------------

  async function saveSetup() {
    const r = await postJson('/api/races', {
      id: raceId,
      seriesId: bundle.race.seriesId,
      number: bundle.race.number,
      name: bundle.race.name,
      date: bundle.race.date,
      earliestStart: document.getElementById('f-earliest').value.trim(),
      targetElapsedMinutes: Number(document.getElementById('f-target').value) || null,
      courseLengthNm: Number(document.getElementById('f-course').value) || null
    });
    if (!r.ok) { setMsg('setup-msg', 'Could not save: ' + errorOf(r)); return; }
    await load();
    setMsg('setup-msg', 'Setup saved.');
  }

  async function calcCourse() {
    const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/course-plan', {
      targetElapsedMinutes: Number(document.getElementById('f-target').value) || null
    });
    if (!r.ok) { setMsg('course-note', 'Could not calculate: ' + errorOf(r)); return; }
    document.getElementById('f-course').value = r.body.courseLengthNm;
    let note = 'slowest TCF ' + fmtTcf(r.body.slowestTcf) + ' at V₀ ' + r.body.v0knots + ' kn';
    if (r.body.limitedBySunset) {
      note += ' — capped to ' + r.body.effectiveDurationMinutes
        + ' min by sunset at ' + r.body.sunsetLocal;
    }
    setMsg('course-note', note);
  }

  async function computeStartTimes() {
    if (bundle.startSheet && !confirm(
        'Start times have already been published for this race. Recompute them?')) return;
    const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/start-times', {
      targetElapsedMinutes: Number(document.getElementById('f-target').value) || null,
      earliestStart: document.getElementById('f-earliest').value.trim() || null
    });
    if (!r.ok) { setMsg('setup-msg', 'Could not compute: ' + errorOf(r)); return; }
    await load();
    setMsg('setup-msg', 'Start times computed — print the start sheet.');
  }

  // --- handicaps -------------------------------------------------------------

  async function processHandicaps() {
    const boats = scorer.handicapEngineInput('pursuit');
    if (!boats.length) { setMsg('handicap-msg', 'No boats to process.'); return; }
    const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/process-handicaps', {
      targetElapsedMinutes: bundle.race.targetElapsedMinutes,
      boats
    });
    if (!r.ok) { setMsg('handicap-msg', 'Could not process: ' + errorOf(r)); return; }

    adjustments = new Map((r.body.adjustments || []).map(a => [String(a.boatId), a]));
    adjustmentsSaved = false;
    document.getElementById('save-handicaps-btn').disabled = false;
    renderHead();
    renderEntrants();
    renderHandicapSummary(r.body);
    setMsg('handicap-msg', 'Computed — review the Adjustment column, then save.');
  }

  function renderHandicapSummary(body) {
    const pool = [...adjustments.values()].reduce((s, a) => s + (a.penaltyMinutes || 0), 0);
    const net = [...adjustments.values()].reduce((s, a) => s + (a.netAdjustmentMinutes || 0), 0);
    document.getElementById('handicap-summary').innerHTML =
      '<p class="hint">Penalty pool ' + pool.toFixed(1) + ' min, redistributed in full '
      + '(net across the fleet ' + net.toFixed(3) + ' min). Target elapsed '
      + esc(body.targetElapsedMinutes) + ' min.</p>';
  }

  async function saveHandicaps() {
    if (!adjustments.size) return;
    if (isDirty() && !confirm('There are unsaved time edits. Save handicaps anyway?')) return;
    const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/save-handicaps',
      { adjustments: [...adjustments.values()] });
    if (!r.ok) { setMsg('handicap-msg', 'Could not save: ' + errorOf(r)); return; }
    adjustmentsSaved = true;
    const carried = r.body.carriedEntrants;
    setMsg('handicap-msg', carried != null
      ? ('Saved — ' + carried + ' boats carried forward to the next race.')
      : 'Saved — this is the last race in the series, so nothing was carried forward.');
    await load();
  }

  async function unlockRace() {
    if (!confirm('Unlock this race? Its saved handicaps are discarded so results '
      + 'can be edited and reprocessed. The next race keeps the TCFs it was '
      + 'already given until you process again.')) return;
    const r = await deleteJson('/api/races/' + encodeURIComponent(raceId) + '/adjustments');
    if (!r.ok) { setMsg('handicap-msg', 'Could not unlock: ' + errorOf(r)); return; }
    await load();
  }

  // --- chrome ----------------------------------------------------------------

  function setCtrlMsg(cls, text) {
    const el = document.getElementById('ctrl-msg');
    el.className = 'banner ' + cls;
    el.textContent = text;
    el.style.display = '';
  }

  function setMsg(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function renderDutyOptions() {
    const sel = document.getElementById('duty-boat');
    sel.innerHTML = '<option value="">— none —</option>' + entrants
      .filter(e => e.boatId)
      .map(e => '<option value="' + esc(e.boatId) + '"'
        + (String(dutyBoatId) === String(e.boatId) ? ' selected' : '') + '>'
        + esc(e.sailNumber + ' ' + e.name) + '</option>').join('');
    sel.disabled = locked;
  }

  function renderRace() {
    const r = bundle.race;
    document.getElementById('race-title').textContent =
      (bundle.seriesName ? bundle.seriesName + ' — ' : '') + 'Race ' + r.number
      + (r.date ? ', ' + fmtDate(r.date) : '');

    document.getElementById('f-earliest').value = (r.earliestStart || '').slice(0, 5);
    document.getElementById('f-target').value = r.targetElapsedMinutes ?? '';
    document.getElementById('f-course').value = r.courseLengthNm ?? '';
    ['f-earliest', 'f-target', 'f-course'].forEach(id => {
      document.getElementById(id).disabled = locked;
    });
    document.getElementById('save-setup-btn').disabled = locked;
    document.getElementById('start-times-btn').disabled = locked;

    const startsHref = '/report-starts.html?raceId=' + encodeURIComponent(raceId);
    const finishHref = '/report-finish.html?raceId=' + encodeURIComponent(raceId);
    document.getElementById('report-starts-link').href = startsHref;
    document.getElementById('report-finish-link').href = finishHref;

    document.getElementById('prev-btn').disabled = !bundle.previousRaceId;
    document.getElementById('next-btn').disabled = !bundle.nextRaceId;
    document.getElementById('prev-btn').onclick = () =>
      location.search = '?raceId=' + encodeURIComponent(bundle.previousRaceId);
    document.getElementById('next-btn').onclick = () =>
      location.search = '?raceId=' + encodeURIComponent(bundle.nextRaceId);

    document.getElementById('unlock-btn').style.display = locked ? '' : 'none';
    document.getElementById('process-btn').disabled = locked;
    document.getElementById('save-handicaps-btn').disabled = locked || !adjustments.size;

    if (locked) {
      setCtrlMsg('banner-warn', 'This race is processed and locked. Its handicaps have '
        + 'been carried forward. Unlock it below to make changes.');
    } else if (!bundle.startSheet) {
      setCtrlMsg('banner-info', 'No start times yet — set the target elapsed time and '
        + 'compute them.');
    } else {
      const src = bundle.entrants && bundle.entrants.tcfSource;
      const from = bundle.entrants && bundle.entrants.sourceRaceNumber;
      setCtrlMsg('banner-ok', src === 'CARRIED_FORWARD' && from != null
        ? ('Handicaps carried forward from race ' + from + '.')
        : 'Ready.');
    }
  }

  // --- load ------------------------------------------------------------------

  async function load() {
    const r = await fetchJson('/api/races/' + encodeURIComponent(raceId));
    if (!r.ok) {
      setCtrlMsg('banner-err', 'Could not load race: ' + errorOf(r));
      return;
    }
    bundle = r.body;
    locked = !!bundle.locked;
    entrants = (bundle.entrants && bundle.entrants.entrants) || [];
    timesMap = (bundle.times && bundle.times.times) ? { ...bundle.times.times } : {};
    dutyBoatId = (bundle.times && bundle.times.dutyBoatId) || null;
    boatOrder = (bundle.times && bundle.times.boatOrder) || [];
    dirtyTcf = new Map();
    dirtyFlags = new Map();
    adjustments = new Map((bundle.adjustments || []).map(a => [String(a.boatId), a]));
    adjustmentsSaved = adjustments.size > 0;

    baseline = stateJson();
    const restored = sessionRestore();

    rebuildScorer();
    renderRace();
    renderDutyOptions();

    document.getElementById('race-setup').style.display = '';
    document.getElementById('race-entrants').style.display = '';
    document.getElementById('handicap-panel').style.display = '';
    document.getElementById('add-entrant-bar').style.display = locked ? 'none' : '';

    if (!entrants.length) {
      setCtrlMsg('banner-warn', 'This race has no entrants yet.');
      await offerSeed();
    }

    renderHead();
    renderEntrants();
    updateSaveBar();

    if (restored) {
      setCtrlMsg('banner-warn', 'Restored unsaved edits from this browser tab. '
        + 'Save them, or Reset to discard.');
    }
  }

  async function offerSeed() {
    const el = document.getElementById('ctrl-msg');
    const btn = document.createElement('button');
    btn.textContent = 'Seed entrants';
    btn.className = 'primary';
    btn.style.marginLeft = '0.75rem';
    btn.onclick = async () => {
      const r = await postJson('/api/races/' + encodeURIComponent(raceId) + '/entrants/seed', {});
      if (!r.ok) { setCtrlMsg('banner-err', 'Could not seed: ' + errorOf(r)); return; }
      sessionClear();
      await load();
    };
    el.appendChild(btn);
  }

  // --- boot ------------------------------------------------------------------

  (async () => {
    raceId = params.get('raceId') || lastRaceId();
    if (!raceId) {
      setCtrlMsg('banner-warn', 'No race selected.');
      document.getElementById('ctrl-msg').innerHTML +=
        ' Pick one on the <a href="/races.html">Races page</a>.';
      return;
    }
    rememberRaceId(raceId);

    const regR = await fetchJson('/api/boats');
    register = regR.ok ? (regR.body || []) : [];

    document.getElementById('save-btn').onclick = doSave;
    document.getElementById('reset-btn').onclick = () => { sessionClear(); load(); };
    document.getElementById('save-setup-btn').onclick = saveSetup;
    document.getElementById('calc-course-btn').onclick = calcCourse;
    document.getElementById('start-times-btn').onclick = computeStartTimes;
    document.getElementById('process-btn').onclick = processHandicaps;
    document.getElementById('save-handicaps-btn').onclick = saveHandicaps;
    document.getElementById('unlock-btn').onclick = unlockRace;
    document.getElementById('hide-dnc').onchange = renderEntrants;
    document.getElementById('hide-finished').onchange = renderEntrants;
    document.getElementById('duty-boat').onchange = (ev) => {
      dutyBoatId = ev.target.value || null;
      // The duty boat is scored on average points; it has no times of its own.
      if (dutyBoatId) {
        const t = timesFor(dutyBoatId);
        t.came = false; t.actualStart = null; t.finish = null;
      }
      touched();
    };
    document.getElementById('add-boat').oninput = refreshBoatMatches;
    document.getElementById('add-existing-btn').onclick = onAddExisting;
    document.getElementById('add-new-btn').onclick = onAddNew;
    document.getElementById('add-oneoff-btn').onclick = onAddOneOff;

    window.addEventListener('beforeunload', (ev) => {
      if (isDirty()) { ev.preventDefault(); ev.returnValue = ''; }
    });

    await load();
  })();
</script>
</body>
</html>
