<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sail-jinx — Races</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<main>
  <h1>Races</h1>

  <div class="toolbar">
    <label for="series-select">Series</label>
    <select id="series-select"><option value="">— all series —</option></select>
    <a id="roster-link" href="#" style="display:none;">roster</a>
  </div>

  <div id="races-state" class="banner banner-info">Loading…</div>

  <section id="add-panel" style="display:none;">
    <h2>Add races</h2>
    <div class="form-grid">
      <label for="new-date">First race date</label>
      <input type="date" id="new-date">

      <label for="new-name">Name</label>
      <input id="new-name" placeholder="optional — e.g. Commodore's Cup">

      <label for="new-repeat">Repeat</label>
      <span>
        every <input id="new-days" type="number" min="0" step="1" size="3"
                     style="width:5em;" placeholder="7"> days
        for <input id="new-count" type="number" min="1" step="1"
                   style="width:5em;" placeholder="10"> races
      </span>
    </div>
    <p class="hint" style="max-width:60rem;">
      Leave both blank for a single race. <code>7</code> days for <code>10</code> races
      gives a race a week for ten weeks; <code>0</code> days for <code>3</code> gives
      three races on the same day.
    </p>
    <div class="toolbar">
      <button id="add-btn" class="primary" type="button" data-requires="admin">Add</button>
      <span id="add-msg" class="hint"></span>
    </div>
  </section>

  <table id="races-table" style="display:none;">
    <thead>
      <tr>
        <th class="num-cell">#</th><th>Date</th><th>Name</th>
        <th id="series-col">Series</th>
        <th class="num-cell">Target</th>
        <th>State</th>
      </tr>
    </thead>
    <tbody id="races-tbody"></tbody>
  </table>
</main>

<script src="/common.js"></script>
<script>
  // The series is a filter, not a page identity: the Races tab on its own shows
  // everything, and choosing one here narrows it and lets races be added to it.
  let seriesId = new URLSearchParams(location.search).get('seriesId') || '';
  let races = [];
  let series = [];

  /**
   * The race lifecycle is derived from the data, not stored — see Race.java.
   * A race is locked once its handicaps have been processed and saved; before
   * that it is either awaiting results or already carrying some.
   */
  function stateOf(r) {
    if (r.abandoned) return { label: 'abandoned', cls: 'state-abandoned' };
    if (r.locked) return { label: 'processed', cls: 'state-done' };
    if (r.hasResults) return { label: 'results captured', cls: 'state-active' };
    if (r.hasStartSheet) return { label: 'start times set', cls: 'state-active' };
    return { label: 'scheduled', cls: 'state-pending' };
  }

  function render() {
    const tbody = document.getElementById('races-tbody');
    const table = document.getElementById('races-table');
    const state = document.getElementById('races-state');
    const rows = seriesId ? races.filter(r => r.seriesId === seriesId) : races;

    document.getElementById('series-col').style.display = seriesId ? 'none' : '';

    if (!rows.length) {
      state.style.display = '';
      state.className = 'banner banner-info';
      state.textContent = seriesId
        ? 'No races in this series yet. Add the first one above.'
        : (series.length
            ? 'No races yet. Choose a series above to add some.'
            : 'No series yet — create one on the Series page first.');
      table.style.display = 'none';
      return;
    }
    state.style.display = 'none';
    table.style.display = '';

    tbody.innerHTML = rows.map(r => {
      const st = stateOf(r);
      const href = '/race.html?raceId=' + encodeURIComponent(r.id);
      return '<tr>'
        + '<td class="num-cell">' + esc(r.number) + '</td>'
        + '<td><a href="' + href + '">' + esc(fmtDate(r.date) || '(no date)') + '</a></td>'
        + '<td><a href="' + href + '">' + esc(r.name || ('Race ' + r.number)) + '</a></td>'
        + (seriesId ? '' : '<td>' + esc(r.seriesName) + '</td>')
        + '<td class="num-cell">' + (r.targetElapsedMinutes == null ? '' : esc(r.targetElapsedMinutes) + ' min') + '</td>'
        + '<td><span class="' + st.cls + '">' + st.label + '</span></td>'
        + '</tr>';
    }).join('');
  }

  function renderSeriesChoice() {
    const sel = document.getElementById('series-select');
    sel.innerHTML = '<option value="">— all series —</option>'
      + series.filter(s => !s.archived || s.id === seriesId)
        .map(s => '<option value="' + esc(s.id) + '"'
          + (s.id === seriesId ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');

    // Races belong to a series, so one has to be chosen before any can be added — and
    // adding one is the admin's, so a visitor is not shown an empty form with no button.
    getWhoami().then(() => {
      document.getElementById('add-panel').style.display =
        (seriesId && isAdmin()) ? '' : 'none';
    });
    const roster = document.getElementById('roster-link');
    roster.style.display = seriesId ? '' : 'none';
    roster.href = '/roster.html?seriesId=' + encodeURIComponent(seriesId);
  }

  document.getElementById('series-select').onchange = (ev) => {
    seriesId = ev.target.value;
    // Keep the URL honest, so the page can be bookmarked or reloaded on this series.
    const url = seriesId
      ? '?seriesId=' + encodeURIComponent(seriesId) : location.pathname;
    history.replaceState(null, '', url);
    renderSeriesChoice();
    render();
  };

  document.getElementById('add-btn').onclick = async () => {
    const msg = document.getElementById('add-msg');
    const date = document.getElementById('new-date').value;
    if (!date) { msg.textContent = 'Pick a date for the first race.'; return; }

    const name = document.getElementById('new-name').value.trim();
    const days = document.getElementById('new-days').value.trim();
    const count = document.getElementById('new-count').value.trim();

    const r = await postJson('/api/races', {
      seriesId, date, name: name || null,
      repeatDays: days === '' ? 0 : Number(days),
      repeatCount: count === '' ? 1 : Number(count)
    });
    if (!r.ok) { msg.textContent = 'Could not add: ' + errorOf(r); return; }

    msg.textContent = r.body.created === 1
      ? 'Added 1 race.' : 'Added ' + r.body.created + ' races.';
    document.getElementById('new-name').value = '';
    await load();
  };

  async function load() {
    const [racesR, seriesR] = await Promise.all([
      fetchJson('/api/races'),
      fetchJson('/api/series')
    ]);
    const state = document.getElementById('races-state');
    if (!racesR.ok) {
      state.className = 'banner banner-err';
      state.textContent = 'Could not load races: ' + errorOf(racesR);
      return;
    }
    races = racesR.body || [];
    series = seriesR.ok ? (seriesR.body || []) : [];
    renderSeriesChoice();
    render();
  }

  load();
</script>
</body>
</html>
