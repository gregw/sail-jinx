<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sail-jinx — Races</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<main>
  <h1>Races</h1>
  <div id="filter-chip" style="display:none;"></div>
  <div id="races-state" class="banner banner-info">Loading…</div>

  <div class="toolbar" id="add-toolbar" style="display:none;">
    <label for="new-date">New race date</label>
    <input type="date" id="new-date">
    <input id="new-name" placeholder="Name (optional)">
    <button id="add-btn" class="primary" type="button">Add race</button>
  </div>

  <table id="races-table" style="display:none;">
    <thead>
      <tr>
        <th class="num-cell">#</th><th>Date</th><th>Name</th>
        <th id="series-col">Series</th>
        <th class="num-cell">Target</th><th class="num-cell">Course</th>
        <th>State</th>
      </tr>
    </thead>
    <tbody id="races-tbody"></tbody>
  </table>
</main>

<script src="/common.js"></script>
<script>
  const seriesId = new URLSearchParams(location.search).get('seriesId');
  let races = [];
  let series = [];

  /**
   * The race lifecycle is derived from the data, not stored — see Race.java.
   * A race is locked once its handicaps have been processed and saved; before
   * that it is either awaiting results or already carrying some.
   */
  function stateOf(r) {
    if (r.abandoned) return { label: 'abandoned', cls: 'state-abandoned' };
    if (r.locked) return { label: 'processed', cls: 'state-done' };
    if (r.hasResults) return { label: 'results captured', cls: 'state-active' };
    return { label: 'scheduled', cls: 'state-pending' };
  }

  function render() {
    const tbody = document.getElementById('races-tbody');
    const table = document.getElementById('races-table');
    const state = document.getElementById('races-state');
    const rows = seriesId ? races.filter(r => r.seriesId === seriesId) : races;

    document.getElementById('series-col').style.display = seriesId ? 'none' : '';

    if (!rows.length) {
      state.style.display = '';
      state.className = 'banner banner-info';
      state.textContent = seriesId
        ? 'No races in this series yet. Add the first one above.'
        : 'No races yet. Pick a series to add one.';
      table.style.display = 'none';
      return;
    }
    state.style.display = 'none';
    table.style.display = '';

    tbody.innerHTML = rows.map(r => {
      const st = stateOf(r);
      const href = '/race.html?raceId=' + encodeURIComponent(r.id);
      return '<tr>'
        + '<td class="num-cell">' + esc(r.number) + '</td>'
        + '<td><a href="' + href + '">' + esc(fmtDate(r.date) || '(no date)') + '</a></td>'
        + '<td><a href="' + href + '">' + esc(r.name || ('Race ' + r.number)) + '</a></td>'
        + (seriesId ? '' : '<td>' + esc(r.seriesName) + '</td>')
        + '<td class="num-cell">' + (r.targetElapsedMinutes == null ? '' : esc(r.targetElapsedMinutes) + ' min') + '</td>'
        + '<td class="num-cell">' + (r.courseLengthNm == null ? '' : esc(r.courseLengthNm) + ' nm') + '</td>'
        + '<td><span class="' + st.cls + '">' + st.label + '</span></td>'
        + '</tr>';
    }).join('');
  }

  function renderChip() {
    const chip = document.getElementById('filter-chip');
    if (!seriesId) return;
    const s = series.find(x => x.id === seriesId);
    chip.style.display = '';
    chip.innerHTML = 'Series: <strong>' + esc(s ? s.name : seriesId) + '</strong> '
      + '<a href="/roster.html?seriesId=' + encodeURIComponent(seriesId) + '">roster</a> '
      + '<a href="/races.html">show all races</a>';
    document.getElementById('add-toolbar').style.display = '';
  }

  document.getElementById('add-btn').onclick = async () => {
    const date = document.getElementById('new-date').value;
    if (!date) { alert('Pick a date for the race.'); return; }
    const name = document.getElementById('new-name').value.trim();
    const r = await postJson('/api/races', { seriesId, date, name: name || null });
    if (!r.ok) { alert('Could not add race: ' + errorOf(r)); return; }
    document.getElementById('new-name').value = '';
    await load();
  };

  async function load() {
    const [racesR, seriesR] = await Promise.all([
      fetchJson('/api/races'),
      fetchJson('/api/series')
    ]);
    const state = document.getElementById('races-state');
    if (!racesR.ok) {
      state.className = 'banner banner-err';
      state.textContent = 'Could not load races: ' + errorOf(racesR);
      return;
    }
    races = racesR.body || [];
    series = seriesR.ok ? (seriesR.body || []) : [];
    renderChip();
    render();
  }

  load();
</script>
</body>
</html>
