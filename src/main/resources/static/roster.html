<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sail-jinx — Roster</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<main>
  <h1>Series roster — <span id="series-name"></span></h1>
  <p class="lead">
    Who is in for the season, and the TCF each boat starts on. The roster seeds
    the first race; after that every race inherits its handicaps from the one
    before.
  </p>

  <div id="roster-state" class="banner banner-info">Loading…</div>

  <table id="roster-table" style="display:none;">
    <thead>
      <tr>
        <th><input type="checkbox" id="check-all" title="Select all"></th>
        <th>Sail #</th><th>Name</th><th>Division</th><th>Spin</th>
        <th class="num-cell">Starting TCF</th>
      </tr>
    </thead>
    <tbody id="roster-tbody"></tbody>
  </table>

  <div id="save-bar" class="save-bar" style="display:none;">
    <button id="save-btn" class="primary" type="button">Save roster</button>
    <button id="reset-btn" type="button">Reset</button>
    <span id="save-summary"></span>
  </div>
</main>

<script src="/common.js"></script>
<script src="/scoring.js"></script>
<script>
  const seriesId = new URLSearchParams(location.search).get('seriesId');

  let boats = [];
  let selected = new Map();   // boatId -> startingTcf
  let savedJson = '';         // serialised baseline, for dirty detection

  function currentJson() {
    return JSON.stringify([...selected.entries()].sort());
  }

  function isDirty() {
    return currentJson() !== savedJson;
  }

  function render() {
    const tbody = document.getElementById('roster-tbody');
    tbody.innerHTML = boats.map(b => {
      const on = selected.has(b.id);
      const tcf = on ? selected.get(b.id) : b.currentTcf;
      return '<tr class="' + (on ? 'selected-row' : '') + '">'
        + '<td><input type="checkbox" class="pick" data-id="' + esc(b.id) + '"'
        + (on ? ' checked' : '') + '></td>'
        + '<td>' + esc(b.sailNumber) + '</td>'
        + '<td>' + esc(b.name) + '</td>'
        + '<td>' + esc(b.division) + '</td>'
        + '<td>' + esc(b.spinnaker) + '</td>'
        + '<td class="num-cell"><input type="number" step="0.0001" class="tcf" data-id="'
        + esc(b.id) + '" value="' + esc(fmtTcf(tcf)) + '"' + (on ? '' : ' disabled') + '></td>'
        + '</tr>';
    }).join('');

    document.querySelectorAll('.pick').forEach(cb => {
      cb.onchange = () => {
        const id = cb.dataset.id;
        if (cb.checked) {
          const boat = boats.find(b => b.id === id);
          const field = document.querySelector('.tcf[data-id="' + CSS.escape(id) + '"]');
          selected.set(id, Number(field.value) || (boat ? boat.currentTcf : 1.0));
        } else {
          selected.delete(id);
        }
        render();
        updateSaveBar();
      };
    });
    document.querySelectorAll('.tcf').forEach(input => {
      input.onchange = () => {
        const id = input.dataset.id;
        if (selected.has(id)) selected.set(id, Number(input.value) || 1.0);
        updateSaveBar();
      };
    });

    document.getElementById('check-all').checked =
      boats.length > 0 && selected.size === boats.length;
  }

  function updateSaveBar() {
    const bar = document.getElementById('save-bar');
    bar.style.display = isDirty() ? '' : 'none';
    document.getElementById('save-summary').textContent =
      selected.size + ' boat' + (selected.size === 1 ? '' : 's') + ' entered';
  }

  document.getElementById('check-all').onchange = (ev) => {
    if (ev.target.checked) {
      for (const b of boats) if (!selected.has(b.id)) selected.set(b.id, b.currentTcf);
    } else {
      selected.clear();
    }
    render();
    updateSaveBar();
  };

  document.getElementById('save-btn').onclick = async () => {
    const entries = [...selected.entries()].map(([boatId, startingTcf]) => ({ boatId, startingTcf }));
    const r = await postJson('/api/series/' + encodeURIComponent(seriesId) + '/roster', { entries });
    const state = document.getElementById('roster-state');
    state.style.display = '';
    if (!r.ok) {
      state.className = 'banner banner-err';
      state.textContent = 'Could not save: ' + errorOf(r);
      return;
    }
    state.className = 'banner banner-ok';
    state.textContent = 'Roster saved — ' + entries.length + ' boats.';
    savedJson = currentJson();
    updateSaveBar();
  };

  document.getElementById('reset-btn').onclick = () => load();

  async function load() {
    const state = document.getElementById('roster-state');
    if (!seriesId) {
      state.className = 'banner banner-err';
      state.innerHTML = 'No series chosen. Pick one on the <a href="/series.html">Series page</a>.';
      return;
    }

    const [boatsR, rosterR, seriesR] = await Promise.all([
      fetchJson('/api/boats'),
      fetchJson('/api/series/' + encodeURIComponent(seriesId) + '/roster'),
      fetchJson('/api/series')
    ]);

    if (!boatsR.ok) {
      state.className = 'banner banner-err';
      state.textContent = 'Could not load boats: ' + errorOf(boatsR);
      return;
    }
    // Retired boats can't be entered for a new season, but one already on the
    // roster stays visible so it can be seen and removed deliberately.
    const rosterIds = new Set((rosterR.ok ? rosterR.body.entries || [] : []).map(e => e.boatId));
    boats = (boatsR.body || []).filter(b => b.active || rosterIds.has(b.id));

    if (seriesR.ok) {
      const s = (seriesR.body || []).find(x => x.id === seriesId);
      document.getElementById('series-name').textContent = s ? s.name : seriesId;
    }

    selected = new Map();
    if (rosterR.ok) {
      for (const e of rosterR.body.entries || []) selected.set(e.boatId, e.startingTcf);
    }
    savedJson = currentJson();

    if (!boats.length) {
      state.className = 'banner banner-info';
      state.innerHTML = 'No boats in the register yet. '
        + 'Add some on the <a href="/boats.html">Boats page</a> first.';
      return;
    }
    state.style.display = 'none';
    document.getElementById('roster-table').style.display = '';
    render();
    updateSaveBar();
  }

  load();
</script>
</body>
</html>
