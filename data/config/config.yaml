# sail-jinx configuration.
#
# sail-jinx v2 is standalone: it has no connection to SailSys or any other
# external system. Series, races, boats and entrants are created in the app and
# stored under data/store/. Results reach SailSys by a human reading the two
# printed reports and typing them in.

club:
  # The domain is the club's identity: series and race ids are scoped by it, and
  # sailing-pf keys the same club the same way. Set once at installation —
  # changing it later orphans every existing series and race id.
  domain: "myc.org.au"
  shortName: "MYC"
  longName: "Manly Yacht Club"
  timezone: "Australia/Sydney"     # used to compute local sunset

  # The club's own addresses, shown on the front page. All four are optional: leave one
  # out and the front page simply does not mention it. They are configuration rather
  # than code because this application is not MYC's — another club runs it against its
  # own file, and a link hard-coded in the page would point at somebody else's club.
  website: "https://www.myc.org.au/"                # the club site itself
  # Where the club's other racing is scored. sail-jinx runs the Jinx pursuit series and
  # nothing else, so this is the answer to "where are the rest of the results".
  otherResults: "https://app.sailsys.com.au/club/23/profile?tab=results"
  seriesEntry: "https://www.myc.org.au/race-series/" # where boats enter a series
  noticeBoard: "https://www.myc.org.au/notice-board/" # the official notice board

algorithm:
  # How the penalties are sized, and how the pool of them comes back.

  penaltyList: [5,4,3,2,1]         # minutes for 1st, 2nd, 3rd — per hour under perHour

  penaltyScaling: fixed            # fixed = the penaltyList minutes as written;
                                   # perHour = a rate, scaled by how long the race took
  givebackGamma: 1.0               # 0 = every share the same
                                   # 1 = proportional to how far behind the first boat
                                   #     home each one finished
  givebackFleet: 1.0               # 0 = no giveback; 0.5 = bottom half; 1 = all fleet giveback
  dnfAllowance: 1                  # minutes past the last finisher a DNF boat scores,
                                   # and what its share of the giveback is worked from
  defaultRaceDuration: 90          # pre-race target when a race does not say; start
                                   # times only, never the handicap arithmetic
  earliestStart: "18:00"           # the slowest boat's gun
  limitBySunset: false             # cap the duration so the fleet finishes by sundown

server:
  port: 8082
  # Reconstruct the externally-visible URL from X-Forwarded-* headers. Set this true
  # when something else terminates the connection — on the Pi, the nginx or Caddy
  # that serves https://myc.mortbay.org — and false when this server is reached
  # directly. It decides what address the OAuth redirect_uri is built from; without
  # it, a proxied login sends Google to http://localhost and fails. Never turn it on
  # for a directly-exposed server: those headers are whatever the client sent.
  forwardedHeaders: false

  # One line per request in the ordinary log — on the Pi, `journalctl -u sail-jinx`.
  # Client address, signed-in user, request line, status, bytes and milliseconds:
  #
  #   [10.19.25.5] - "GET /api/races/… HTTP/1.1" 200 4210 12ms
  #
  # On by default. It is what tells you whether a request reached this server at all,
  # which is the first question whenever something in front of it — a reverse proxy,
  # a sign-in redirect — is misbehaving. Set false for a quiet journal on the club PC.
  requestLog: true
